[package]
name = "enclave-server"
version = "0.1.0"
description = "Reference enclave server: verifies hardware attestations and emits BCS-signed outcomes for on-chain consumption."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "enclave-server"
path = "src/main.rs"

[dependencies]
attestation-core = { path = "../attestation-core" }
attest-apple = { path = "../attest-apple" }

# Server
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

# Encoding
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
bcs = { workspace = true }

# Errors
anyhow = { workspace = true }
thiserror = { workspace = true }

# VSOCK (only used inside the Nitro Enclave, but unconditionally linked)
tokio-vsock = "0.7"

# Nitro NSM (Linux-only; provides /dev/nsm attestation)
[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
