[package]
name = "attest-android"
version = "0.1.0"
description = "Verify Android Key Attestation certificate chains, producing canonical outcomes for on-chain consumption."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
attestation-core = { path = "../attestation-core" }

# Encoding
x509-cert = { workspace = true, features = ["pem"] }
der = { workspace = true }
const-oid = { workspace = true }
spki = { workspace = true }

# Crypto
p256 = { workspace = true }
p384 = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }

# Errors
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pem = "3"
