[workspace]
resolver = "2"
members = [
    "rust/attestation-core",
    "rust/attest-apple",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/unconfirmedlabs/attestation"

[workspace.dependencies]
# Crypto
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"

# Encoding
ciborium = "0.2"
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std", "derive"] }
const-oid = { version = "0.9", features = ["db"] }
spki = "0.7"
bcs = "0.1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"

# Errors
thiserror = "1"

# Dev deps
serde_json = "1"
